id: acu-px-namespace
language: csharp
severity: error
message: "Customization code in a PX.* namespace. Keep custom code under the HC namespace even when it extends PX.Objects graphs or DACs."
metadata:
  skill: acumatica-namespaces
rule:
  any:
    - kind: namespace_declaration
      has: { field: name, regex: '^PX\.' }
    - kind: file_scoped_namespace_declaration
      has: { field: name, regex: '^PX\.' }
