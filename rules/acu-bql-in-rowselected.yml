id: acu-bql-in-rowselected
language: csharp
severity: warning
message: "BQL query inside a RowSelected handler (PX1049). RowSelected runs on every UI refresh; move the query to another event or cache the result."
metadata:
  skill: acumatica-acuminator
rule:
  kind: invocation_expression
  regex: '^(PXSelect|SelectFrom|PXSelectReadonly|PXSelectJoin|PXSelectGroupBy)'
  inside:
    stopBy: end
    kind: method_declaration
    any:
      - has: { kind: parameter_list, regex: 'RowSelected' }
      - has: { field: name, regex: '_RowSelected$' }
