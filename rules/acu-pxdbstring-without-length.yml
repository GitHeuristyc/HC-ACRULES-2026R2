id: acu-pxdbstring-without-length
language: csharp
severity: warning
message: "[PXDBString] without a length. Pass the column length as the first argument, for example [PXDBString(15, IsUnicode = true)]."
metadata:
  skill: acumatica-dac
rule:
  kind: attribute
  has: { field: name, regex: '^PXDBString(Attribute)?$' }
  not:
    has:
      stopBy: end
      kind: attribute_argument
      not: { regex: '^\s*\w+\s*[=:]' }
